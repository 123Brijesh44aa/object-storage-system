spring:
  application:
    name: ApiGateway

  # ── Redis ────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:brijesh}

  # ── Gateway ──────────────────────────────────────────────
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:

        # Public auth routes — no JWT required
        - id: auth-public
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        # OAuth2 routes - must go through Auth Service
        - id: oauth2-route
          uri: lb://auth-service
          predicates:
            - Path=/oauth2/**,/login/oauth2/**

        # Protected user routes — JWT required
        - id: auth-protected
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - AuthenticationFilter

        # Admin routes — JWT required
        - id: admin-routes
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - AuthenticationFilter

      # Global CORS
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowed-headers:
              - Authorization
              - Content-Type
            allow-credentials: false    # must be false when origin is *

# ── Server ────────────────────────────────────────────────
server:
  port: 8080

# ── Eureka ────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# ── JWT ───────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-characters-long}

# ── Actuator ──────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: always

# ── Logging ───────────────────────────────────────────────
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.brijesh.apigateway: DEBUG
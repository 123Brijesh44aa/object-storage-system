spring:
 application:
  name:
   auth-service

 # --- Database ---------------------------------------------
 datasource:
  url: jdbc:mysql://localhost:3308/auth_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
  username: ${DB_USERNAME}
  password: ${DB_ROOT_PASSWORD}
  driver-class-name: com.mysql.cj.jdbc.Driver

  # ---- JPA -----------------------------------
 jpa:
   hibernate:
    ddl-auto: validate            # Flyway manages schema, hibernates only validates
   show-sql: true
   properties:
     hibernate:
       dialect: org.hibernate.dialect.MySQL8Dialect
       format_sql: true

 # 1. Flyway manages schema, hibernates only validates
 flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true

 # Redis
 data:
   redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}

 # Mail
 mail:
  host:
  port:
  username:
  password:
  properties:
   mail.smtp.auth: true
   mail.smtp.starttls.enable: true

 # App Custom Properties
app:
  frontend-url: ${FRONTEND_URL:*}
  jwt:
   secret: ${JWT_SECRET}
   access-token-expiry: 900000 # 15 minutes in milliseconds
   refresh-token-expiry: 604800000

 # Server
server:
 port: 8080
 error:
  include-message: always
  include-binding-errors: always

# Logging
logging:
 level:
   com.brijesh: DEBUG
   org.springframework.security: DEBUG
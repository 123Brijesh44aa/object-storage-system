spring:
  application:
    name: metadata-service


  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Database
  datasource:
    url: jdbc:mysql://${META_DB_HOST:localhost}:${META_DB_PORT:3311}/${META_DB_NAME:metadata_service_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${META_DB_USERNAME:root}
    password: ${META_DB_ROOT_PASSWORD:brijesh}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ---- JPA -----------------------------------
  jpa:
    hibernate:
      ddl-auto: validate            # Flyway manages schema, hibernates only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  # 1. Flyway manages schema, hibernates only validates
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true


  # Kafka Consumer Config
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: metadata-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
#        spring.json.value.default.type: com.brijesh.metadataservice.event.BaseEvent
server:
  port: 8084

# Eureka
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}


management:
  endpoints:
    web:
      exposure:
        include: health, info


logging:
  level:
    com.brijesh.metadataservice: DEBUG
    org.springframework.kafka: INFO